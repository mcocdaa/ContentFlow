<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>合租事务所 · 老板面试记录</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;align-content:center;justify-items:center;background:#191c23;color:#f4f0e6;font:16px "Noto Sans CJK SC",sans-serif}main{width:min(100%,calc((100svh - 72px) * 16 / 9),1440px)}canvas{display:block;width:100%;height:auto;background:#f6f2e7}nav{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 4px}button{font:inherit;color:inherit;border:1px solid #787c86;background:transparent;border-radius:4px;padding:5px 12px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffa585}input{flex:1;min-width:40px;accent-color:#f69370}output{font-variant-numeric:tabular-nums;font-size:14px}#status{margin:0}body.export{display:block;background:#f6f2e7}.export main{width:100vw}.export nav,.export #status{display:none}
</style>
</head><body><main>
<canvas width="1920" height="1080" role="img" aria-label="三个 AI 退回老板的简历，加到 64 GB 内存后录用老板。"></canvas>
<nav aria-label="样片播放控制"><button id="play" type="button" disabled>播放</button><input id="seek" type="range" min="0" max="18" step=".01" value="0" aria-label="播放位置"><output id="time">00:00</output><button id="mute" type="button" aria-pressed="false">静音</button></nav>
<p id="status" role="status"></p><audio preload="auto"></audio>
</main><script src="story.js"></script><script src="../../../../library/motion_cards/player.js"></script></body>
</html>
