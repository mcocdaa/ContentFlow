const stages=[
 {start:0,end:60,name:'定一句目标',action:'写清楚，你想交出什么。',lines:['先写一个小标题。','把目标缩成一句话。'],example:['给合作者的一份说明','“我想用三句话，讲清这次改动。”'],color:'#E6B262'},
 {start:60,end:420,name:'写完草稿',action:'先写三句，让它初具形状。',lines:['发生了什么？','你做了什么？结果怎样？'],example:['试试用这三个开头','“原先……  我试了……  现在……”'],color:'#5CA29A'},

];
const ink='#164552',muted='#486E70',line='#ACC6BA',teal='#177E78',white='#FFFDF2';
function text(s,x,y,size,weight=500,color=ink,align='left'){
 ctx.font=weight+' '+size+'px '+font;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);
}
function shape(color,fn){ctx.beginPath();fn();ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function rule(x1,y1,x2,y2,color=line,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fill()}
function coast(){
 const sky=ctx.createLinearGradient(0,0,1600,1000);sky.addColorStop(0,'#F8F5D9');sky.addColorStop(.59,'#DDEDDC');sky.addColorStop(1,'#ADDBCF');ctx.fillStyle=sky;ctx.fillRect(0,0,1920,1080);
 circle(1045,760,124,'#F8D291');
 const coastLayers=[['#C0DCD2',778,30,0],['#A1CCC0',808,24,.8],['#83BCAE',846,29,2],['#6CA9A2',891,24,3.5],['#509994',954,29,1.1],['#3B8988',1020,29,2.4]];
 for(const [color,y,a,p] of coastLayers){
  shape(color,()=>{ctx.moveTo(-6,1080);for(let x=-6;x<=1932;x+=6)ctx.lineTo(x,y+a*Math.sin(x/245+p)+11*Math.cos(x/84+p));ctx.lineTo(1932,1080)});
 }
 for(let j=0;j<54;j++){const x=(j*293+43)%1920,y=885+(j*31)%197;ctx.beginPath();ctx.moveTo(x,y);ctx.bezierCurveTo(x+13,y-3,x+21,y-3,x+38+(j%4)*10,y-1);ctx.lineWidth=2;ctx.strokeStyle='#C7E5D791';ctx.stroke()}
}
function bird(x,y,scale){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.strokeStyle=muted;ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-17,-4);ctx.quadraticCurveTo(-3,-6,0,3);ctx.quadraticCurveTo(6,-6,18,-9);ctx.stroke();ctx.restore()}
function portraitSeal(cx,cy,radius){
 // Same source-space head-and-shoulders crop for every seal, centred at (178, 143).
 const scale=radius/164;
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.clip();
 ctx.translate(cx-178*scale,cy-143*scale);ctx.scale(scale,scale);
 ctx.drawImage(portrait,0,0);ctx.restore();
}
function desk(i){
 const s=stages[i];
 rounded(1192,225,578,643,22,'#27696326');rounded(1180,213,578,643,22,white);
 rule(1220,315,1712,315);text('手 边 工 作 单',1231,272,24,700,teal);text('0'+(i+1)+' / 04',1707,272,25,700,muted,'right');
 text(s.name,1230,375,45,800);text(s.lines[0],1230,453,32);text(s.lines[1],1230,510,32);
 rule(1230,566,1707,566);text(s.example[0],1230,606,23,600,muted);

 // The circular portrait overlaps the lower edge, like a paper seal on the field sheet.
 circle(1663,793,89,'#D7ECE5');portraitSeal(1663,793,84);
}
function base(i){
 const s=stages[i];coast();rule(118,139,1795,139,'#88AD9F');

 text('海岸写作室',185,250,33,700,teal);text(s.action,185,323,48,750);

 rounded(185,698,920,12,6,'#A8C5B8');
 const labels=['定目标','写草稿','补缺口','保存'];for(let j=0;j<4;j++){
  const x=187+j*232;circle(x+8,771,7,j<=i?teal:'#84AEA1');text(labels[j],x+28,770,25,j===i?800:500,j===i?ink:muted);
 }
 bird(1008,256,.8);bird(1048,238,.55);desk(i);
}
function at(elapsed){const index=stages.findIndex(s=>elapsed<s.end);return index<0?stages.length-1:index}
function digits(t){const sec=t>=600-1/60?0:Math.ceil(600-t);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function draw(t){
 base(at(t));text(digits(t),643,478,168,700,ink,'center');const w=920*t/600;if(w>0)rounded(185,698,w,12,Math.min(6,w/2),teal);
 if(t>=600){rounded(480,602,326,55,26,'#DBEBD9');text('第一版已完成',643,631,25,750,teal,'center')}
}
function cover(){
 coast();
 // Both headline lines and the portrait fit the central 1440-pixel crop.
 rounded(271,183,1378,650,46,'#FFFAE8');
 rounded(354,249,10,44,5,'#168077');
 text('鲸鱼专注钟',382,272,42,750,'#246661');
 text('10分钟',345,447,202,900,'#123E49');
 rounded(351,747,694,17,8,'#E8AE66');
 text('写完初稿',345,651,178,900,'#105A55');
 circle(1361,519,222,'#78AFA6');
 circle(1361,519,212,'#DBEADF');
 portraitSeal(1361,519,203);
}
let accumulated=0,started=null,handle=null;
function elapsed(){return Math.min(600,accumulated+(started===null?0:(Date.now()-started)/1000))}
function update(){const t=elapsed();draw(t);if(t>=600){accumulated=600;started=null;play.textContent='再写一轮';statusLine.textContent='十分钟到了，记得保存第一版。';return}
 if(started!==null)handle=setTimeout(update,200)}
play.onclick=()=>{if(handle!==null)clearTimeout(handle);if(started!==null){accumulated=elapsed();started=null;play.textContent='继续专注';statusLine.textContent='已暂停，写好的文字会保留。'}
 else{if(accumulated>=600)accumulated=0;started=Date.now();play.textContent='暂停';statusLine.textContent='正在计时，可以切换到自己的文档。';reset.disabled=false}update()};
reset.onclick=()=>{clearTimeout(handle);accumulated=0;started=null;play.textContent='开始专注';reset.disabled=true;statusLine.textContent='计时已归零，你写的文字已保留。';draw(0)};
try{task.value=localStorage.getItem('contentflow.whale.draft')||''}catch{}
task.oninput=()=>{try{localStorage.setItem('contentflow.whale.draft',task.value)}catch{}};
const ready=Promise.all([portrait.decode(),document.fonts.ready]);
window.FocusTimer={ready,stages,renderBase:base,renderAt:draw,renderCover:cover,digits};
if(location.search.includes('export'))document.documentElement.classList.add('export');
ready.then(()=>draw(0));
</script>
