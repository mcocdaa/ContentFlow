<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>纸飞机与星星 · 双比例裁图实验</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;align-content:center;justify-items:center;background:#142930;color:#f6f2e8;font:16px "Noto Sans CJK SC",sans-serif}main{width:min(100%,calc((100svh - 66px)*16/9),1440px)}canvas{display:block;width:100%;height:auto}nav{display:flex;align-items:center;gap:12px;padding:8px 2px}button{color:inherit;background:transparent;border:1px solid #96adab;border-radius:4px;padding:6px 15px;font:inherit}input{flex:1;min-width:40px;accent-color:#ffb84d}output{font-variant-numeric:tabular-nums}#status{margin:0}.export{display:block;background:#faf5e9}.export main{width:100vw}.export nav,.export #status{display:none}</style></head>
<body><main><canvas width="1920" height="1080" role="img" aria-label="同一张面试场景原图的两种四比三像素裁切。"></canvas><nav><button type="button" id="play" disabled>播放</button><input type="range" min="0" max="80" step=".01" value="0" id="seek" aria-label="播放位置"><output id="time">00:00</output><button id="mute" type="button" aria-pressed="false">静音</button></nav><p role="status" id="status"></p><audio preload="auto"></audio></main>
<script src="../../demo/crop.js"></script><script src="story.js"></script><script src="../../../../library/motion_cards/player.js"></script></body></html>
