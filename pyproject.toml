[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "contentflow"
version = "0.1.0"
description = "End-to-end 3D figurine & anime virtual idol technical tutorial video production pipeline (Blender MMD + Seedream/Seedance + ComfyUI + EbSynth + RIFE)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pillow>=12.3.0",
    "requests>=2.34.2",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.4.0",
    "mypy>=2.4.0",
    "types-requests>=2.33.0.20261006",
]

[project.scripts]
contentflow = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["core*", "config*"]

[tool.setuptools.package-data]
config = ["*.json"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    "vendor",
    ".venv",
    "projects",
    "projects/*/temp_clips",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = true
exclude = [
    "^vendor/",
    "^projects/",
    "^\\.venv/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
