name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check cli.py core/ config/ .agents/skills/figure-tutorial-video/scripts/ tests/

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Run Mypy type checker
        run: mypy cli.py core/ config/ .agents/skills/figure-tutorial-video/scripts/ tests/

      - name: Run Pytest unit tests
        run: pytest -v

      - name: Run Node skill tests
        run: node --test .agents/skills/byted-ark-seedance-skill/tests/*.test.js .agents/skills/byted-ark-seedream-skill/tests/*.test.js

      - name: Build and verify Python package wheel
        run: |
          python -m build
          python -c "import glob, zipfile; z = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'cli.py' in z and 'config/channel_specs.json' in z, z"
