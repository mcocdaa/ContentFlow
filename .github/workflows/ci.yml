name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check cli.py core/ config/ .agents/skills/figure-tutorial-video/scripts/ tests/

      - name: Run Mypy type checker
        run: mypy cli.py core/ config/ .agents/skills/figure-tutorial-video/scripts/ tests/

      - name: Run Pytest unit tests
        run: pytest -v

      - name: Run Node skill tests
        run: node --test .agents/skills/byted-ark-seedance-skill/tests/*.test.js .agents/skills/byted-ark-seedream-skill/tests/*.test.js
