name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Verify & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]"

      - name: Run quality & unit checks
        run: |
          ruff check cli.py core/ config/ .agents/skills/figure-tutorial-video/scripts/ tests/
          ruff format --check .
          mypy cli.py core/ config/ .agents/skills/figure-tutorial-video/scripts/ tests/
          pytest -v
          node --test .agents/skills/byted-ark-seedance-skill/tests/*.test.js .agents/skills/byted-ark-seedream-skill/tests/*.test.js

      - name: Build Python package
        run: |
          python -m build
          python -c "import glob, zipfile; z = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'cli.py' in z and 'config/channel_specs.json' in z, z"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
