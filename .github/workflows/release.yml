name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Verify & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify version matches git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          assert version == expected, (
              f"pyproject.toml version {version!r} does not match tag {os.environ['GITHUB_REF_NAME']!r}"
          )
          print(f"Verified pyproject.toml version matches tag: {version}")
          PY

      - name: Install system dependencies (FFmpeg & Open-Source CJK Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk fonts-wqy-zenhei

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]"

      - name: Run quality & unit checks
        run: |
          ruff check cli.py core/ config/ tests/
          ruff format --check .
          mypy cli.py core/ config/ tests/
          pytest -v

      - name: Build Python package
        run: |
          python -m build
          python -c "import glob, zipfile; z = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'cli.py' in z and 'config/channel_specs.json' in z, z"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
